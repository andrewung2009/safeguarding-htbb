<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTBB Safeguarding Training</title>
  <meta name="description" content="HTBB Church Safeguarding Training Course — learn how to recognise, respond to, and prevent abuse in church ministry.">
  <link rel="icon" type="image/png" href="./htbb-logo.png">
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#0d9488">
</head>
<body>

  <!-- Loading Screen -->
  <div id="loading" class="loading-screen">
    <div class="loading-logo">
      <img src="htbb-logo.png" alt="HTBB">
    </div>
    <div class="loading-spinner"></div>
    <p class="loading-text">Loading course...</p>
  </div>

  <!-- App Container -->
  <div id="app" class="app-layout" style="display:none;">

    <!-- Top Header -->
    <header class="top-header">
      <button id="headerBackBtn" class="header-back-btn" style="display:none;" aria-label="Back to modules">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <img src="./htbb-logo.png" alt="HTBB" class="header-logo-img">
      <div class="header-title-area">
        <span class="header-course-title">HTBB Safeguarding</span>
      </div>
      <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
      </button>
      <div class="header-progress" id="headerProgressWrap" style="display:none;">
        <div class="header-progress-label">
          <span id="headerProgressLabel">Lesson Progress</span>
          <span id="headerProgressText">0%</span>
        </div>
        <div class="header-progress-bar">
          <div id="headerProgressFill" class="header-progress-fill" style="width:0%"></div>
        </div>
      </div>
      <div class="header-stats" id="headerStatsWrap">
        <div class="header-stat">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>
          <span id="headerQuizCount">0/0 quizzes</span>
        </div>
        <div class="header-stat">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          <span>~30 min videos</span>
        </div>
      </div>
    </header>

    <!-- Content Area -->
    <div id="contentArea" class="content-area"></div>

    <!-- Bottom Navigation -->
    <footer class="bottom-nav" id="bottomNav" style="display:none;">
      <button id="prevBtn" class="btn btn-outline btn-sm" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><polyline points="15 18 9 12 15 6"/></svg>
        <span>Previous</span>
      </button>
      <div class="block-steps" id="blockSteps"></div>
      <button id="nextBtn" class="btn btn-primary btn-sm">
        <span>Next</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><polyline points="9 18 15 12 9 6"/></svg>
      </button>
    </footer>
  </div>

  <script type="module" src="/src/main.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('./sw.js').catch(function () {});
      });
    }
  </script>
</body>
</html>
